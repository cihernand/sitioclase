---
layout: default
---

<section class="topic-hero">
  <div class="container">
    <p class="eyebrow">Tema {{ page.numero }}</p>

    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="hero-text">{{ page.description }}</p>
    {% endif %}
  </div>
</section>

<section class="section">
  <div class="container topic-content">
    {{ content }}
  </div>
</section>
