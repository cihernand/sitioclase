<!doctype html>
<html lang="{{ site.lang | default: 'es' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.title %}
        {{ page.title }} | {{ site.title }}
      {% else %}
        {{ site.title }}
      {% endif %}
    </title>

    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    >

    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}">

  </head>

  <body data-baseurl="{{ site.baseurl }}">
    {% include site_header.html %}

    <main>
      {{ content }}
    </main>

    {% include site_footer.html %}

    <script src="{{ '/assets/js/widgets.js' | relative_url }}"></script>
  </body>
</html>
